name: Continuous Integration & Deployment

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build

  deploy:
    name: Deploy to Vercel
    # 1. Dependency: Run deployment ONLY if the build-and-test job completes successfully
    needs: build-and-test
    # 2. Safety Guard: Deploy ONLY when commits are merged directly to the main branch
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 3: Install Vercel CLI globally on the runner
      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Step 4: Deploy to Vercel (Production)
      - name: Deploy to Vercel (Production)
        run: vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
